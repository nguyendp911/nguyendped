name: iOS Device Build (unsigned)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-device:
    name: Build iOS device arm64 without signing
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show installed Xcode
        run: xcodebuild -version

      - name: Validate Unicode scramble algorithm
        run: |
          swiftc Engines/ScrambleEngine.swift Tests/ScrambleSmokeTest.swift -o "$RUNNER_TEMP/scramble-smoke"
          "$RUNNER_TEMP/scramble-smoke"

      - name: Build unsigned iOS device app (iphoneos)
        run: |
          set -o pipefail
          xcodebuild \
            -project SecretTextStudio.xcodeproj \
            -scheme SecretTextStudio \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Verify device binary and package unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/SecretTextStudio.app"
          test -d "$APP"
          test -f "$APP/SecretTextStudio"
          file "$APP/SecretTextStudio"
          lipo -archs "$APP/SecretTextStudio" | grep -w arm64
          mkdir -p "$RUNNER_TEMP/package/Payload"
          ditto "$APP" "$RUNNER_TEMP/package/Payload/SecretTextStudio.app"
          (cd "$RUNNER_TEMP/package" && /usr/bin/zip -q -r "$RUNNER_TEMP/SecretTextStudio-unsigned.ipa" Payload)
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/SecretTextStudio-iphoneos-app.zip"
          ls -lh "$RUNNER_TEMP/SecretTextStudio-unsigned.ipa" "$RUNNER_TEMP/SecretTextStudio-iphoneos-app.zip"

      - name: Upload unsigned iPhone build
        uses: actions/upload-artifact@v4
        with:
          name: SecretTextStudio-iOS-Device-Unsigned
          path: |
            ${{ runner.temp }}/SecretTextStudio-unsigned.ipa
            ${{ runner.temp }}/SecretTextStudio-iphoneos-app.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Xcode log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
