name: iOS Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS Simulator app
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show installed Xcode
        run: xcodebuild -version

      - name: Validate Unicode scramble algorithm
        run: |
          swiftc Engines/ScrambleEngine.swift Tests/ScrambleSmokeTest.swift -o "$RUNNER_TEMP/scramble-smoke"
          "$RUNNER_TEMP/scramble-smoke"

      - name: Build iOS Simulator (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project SecretTextStudio.xcodeproj \
            -scheme SecretTextStudio \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Package simulator app
        if: success()
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/SecretTextStudio.app" \
            "$RUNNER_TEMP/SecretTextStudio-iOS-Simulator.zip"

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SecretTextStudio-iOS-Simulator
          path: ${{ runner.temp }}/SecretTextStudio-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
